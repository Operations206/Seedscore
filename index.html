<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Seedscore</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0d1117;
      color: #c9d1d9;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background-color: #161b22;
      border-bottom: 1px solid #30363d;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    header svg {
      fill: #c9d1d9;
      flex-shrink: 0;
    }

    header .repo-path {
      font-size: 14px;
      color: #58a6ff;
      text-decoration: none;
    }

    header .repo-path:hover {
      text-decoration: underline;
    }

    header .separator {
      color: #8b949e;
      margin: 0 4px;
    }

    main {
      max-width: 1012px;
      margin: 32px auto;
      padding: 0 24px;
      width: 100%;
    }

    .repo-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }

    .repo-header h1 {
      font-size: 26px;
      font-weight: 600;
      color: #e6edf3;
    }

    .badge {
      font-size: 12px;
      padding: 2px 8px;
      border-radius: 2em;
      border: 1px solid #30363d;
      color: #8b949e;
      font-weight: 500;
    }

    .tabs {
      display: flex;
      border-bottom: 1px solid #30363d;
      margin-bottom: 24px;
      gap: 0;
    }

    .tab {
      padding: 10px 16px;
      font-size: 14px;
      color: #8b949e;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .tab.active {
      color: #e6edf3;
      border-bottom-color: #f78166;
      font-weight: 600;
    }

    .tab:hover:not(.active) {
      color: #c9d1d9;
    }

    .content-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 296px;
      gap: 24px;
    }

    @media (max-width: 768px) {
      .content-layout {
        grid-template-columns: 1fr;
      }
    }

    .readme-container {
      background-color: #0d1117;
      border: 1px solid #30363d;
      border-radius: 6px;
      overflow: hidden;
    }

    .readme-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      background-color: #161b22;
      border-bottom: 1px solid #30363d;
    }

    .readme-header span {
      font-size: 14px;
      font-weight: 600;
      color: #e6edf3;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .readme-body {
      padding: 32px;
    }

    .readme-body h1 {
      font-size: 2em;
      font-weight: 600;
      border-bottom: 1px solid #30363d;
      padding-bottom: 0.3em;
      margin-bottom: 16px;
      color: #e6edf3;
    }

    .sidebar-box {
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .sidebar-box h2 {
      font-size: 16px;
      font-weight: 600;
      color: #e6edf3;
      margin-bottom: 16px;
    }

    .sidebar-box p {
      font-size: 14px;
      color: #8b949e;
      margin-bottom: 12px;
    }

    .topics {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }

    .topic {
      background-color: #388bfd1a;
      color: #58a6ff;
      border-radius: 2em;
      padding: 2px 10px;
      font-size: 12px;
      font-weight: 500;
    }

    .stats {
      margin-top: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .stat-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      color: #8b949e;
    }

    .stat-item svg {
      fill: #8b949e;
      flex-shrink: 0;
    }

    footer {
      margin-top: auto;
      border-top: 1px solid #30363d;
      padding: 16px 24px;
      text-align: center;
      font-size: 12px;
      color: #8b949e;
    }

    footer a {
      color: #58a6ff;
      text-decoration: none;
    }

    footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
